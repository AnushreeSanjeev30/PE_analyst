server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the routes: serve index.html for anything that is not a real file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they are safe to cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
